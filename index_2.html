<style>
/* Layout: one centered column floating in a dusk sky; a fixed sunset scene (sky gradient, setting sun, striped sea) sits behind it. Single dark look by choice. */
:root {
  --night: #0a1230;
  --dusk: #1b2a63;
  --violet: #4b2f7a;
  --rose: #c8456f;
  --ember: #f2803a;
  --sun: #ffd27a;
  --ink: #fff7ee;
  --ink-soft: #f6d9c4;
  --fb: #1877f2;
  --ig: linear-gradient(45deg, #feda75 0%, #fa7e1e 25%, #d62976 55%, #962fbf 78%, #4f5bd5 100%);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 20px;
  overflow-x: hidden;
}

/* Sunset scene */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(180deg, var(--night) 0%, var(--dusk) 34%, var(--violet) 56%, var(--rose) 72%, var(--ember) 84%, var(--sun) 92%); }
.stars { position: absolute; inset: 0 0 50% 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 46% 22%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 81% 26%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 6%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 7% 38%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 40%, #fff 50%, transparent 51%);
  opacity: .7; animation: twinkle 5s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .35; } }
.sun { position: absolute; left: 50%; bottom: 7%; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #fff3cf 0%, var(--sun) 35%, var(--ember) 75%);
  box-shadow: 0 0 80px 30px rgba(255,170,90,.45), 0 0 200px 80px rgba(242,128,58,.25);
  animation: set 9s ease-in-out infinite alternate; }
@keyframes set { to { transform: translateY(18px); } }
.sea { position: absolute; left: 0; right: 0; bottom: 0; height: 16%;
  background:
    repeating-linear-gradient(180deg, rgba(255,210,122,.35) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, #2a1f5a 0%, var(--night) 100%); }

.wrap {
  position: relative; z-index: 1;
  max-width: 440px; margin: 0 auto;
  padding-block: 52px 48px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
.id { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.photo {
  width: 148px; height: 148px; border-radius: 50%; padding: 4px;
  background: conic-gradient(from 180deg, var(--sun), var(--ember), var(--rose), var(--violet), var(--sun));
  box-shadow: 0 0 40px rgba(242,128,58,.35), 0 18px 40px rgba(0,0,0,.4);
  animation: pop .6s cubic-bezier(.34,1.56,.64,1) both;
}
.photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 4px solid var(--night); }
.hi { margin: 10px 0 0; font-weight: 700; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--sun); }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance;
  text-shadow: 0 2px 18px rgba(10,18,48,.6); }

.links { width: 100%; display: flex; flex-direction: column; gap: 14px; list-style: none; margin: 0; padding: 0; }
.links li { animation: rise .5s ease-out both; }
.links li:nth-child(1) { animation-delay: .12s; }
.links li:nth-child(2) { animation-delay: .22s; }
.btn {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 14px 18px 14px 14px; border-radius: 18px;
  color: #fff; text-decoration: none;
  font-weight: 700; font-size: 16.5px;
  box-shadow: 0 12px 26px rgba(10,18,48,.45);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, filter .18s ease;
}
.btn:hover { transform: translateY(-3px); filter: brightness(1.06); box-shadow: 0 16px 32px rgba(10,18,48,.55); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.fb { background: var(--fb); }
.ig { background: var(--ig); }
.icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,.16); }
.icon svg { width: 24px; height: 24px; }
.label { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.sub { font-weight: 500; font-size: 13.5px; opacity: .9; }
.arrow { flex: none; font-size: 22px; font-weight: 700; opacity: .85; }

footer { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.note { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--ink); text-shadow: 0 2px 12px rgba(10,18,48,.6); }
.made { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--night); font-weight: 700; opacity: .75; }

@keyframes pop { from { transform: scale(.65); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .stars, .sun, .photo, .links li { animation: none; }
  .btn { transition: none; } .btn:hover { transform: none; }
}
</style>
</head>
